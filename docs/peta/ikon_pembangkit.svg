<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ikon jenis pembangkit — Peta Pembangkit FASOP (/opsis/peta/)

  Sumber sebenarnya: blok <defs><symbol id="ic-…"> di
  opsis/templates/opsis/peta_pembangkit.html. File ini dibuat dari blok itu.

  CARA MENGEMBALIKAN HASIL EDIT KE APLIKASI
  1. Edit gambar di dalam salah satu <g id="ic-…"> di bawah.
  2. Salin isinya (path/rect/circle-nya saja, tanpa <g> pembungkus).
  3. Tempel menggantikan isi <symbol id="ic-…"> yang sesuai di template tadi.

  ATURAN YANG HARUS DIJAGA
  - Gambar harus muat di kotak 24x24 (di sini ditampilkan 2.2x agar mudah diedit;
    yang disalin ke template adalah koordinat 24x24 aslinya — jangan ikut
    menyalin transform="translate(...) scale(2.2)").
  - Pakai fill="currentColor" / stroke="currentColor", jangan warna tetap:
    warnanya ditentukan JENIS_WARNA di opsis/models.py dan ikonnya selalu putih
    di atas lingkaran berwarna. Lingkaran berwarna di file ini hanya pratinjau.
  - Nama id harus tetap ic-plta, ic-pltu, dst. — template memilih ikon dari
    kode jenis pembangkit (huruf kecil).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300"
     width="600" height="300">
  <rect width="100%" height="100%" fill="#0b1120"/>
  <g>
